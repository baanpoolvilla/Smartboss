services:
  postgres:
    image: postgres:16
    container_name: easyboss-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: easyboss
      POSTGRES_PASSWORD: easyboss
      POSTGRES_DB: easyboss
    ports:
      - "5432:5432"
    volumes:
      - easyboss-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyboss -d easyboss"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: easyboss-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - easyboss-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  easyboss-pgdata:
  easyboss-redisdata:
