name: CI

# ตาม docs/deploy.md §14 ("ยังไม่พร้อม — ต้องรู้ก่อนเปิดให้ลูกค้าจ่ายเงิน") และ
# Claude outputs/SmartBoss-Fix-List-2026-09-11.md ข้อ 3 — ตอนนี้ไม่มี CI เลย
# แปลว่า lint/typecheck/test ไม่ถูกบังคับรันก่อน merge เลย
#
# แยกเป็น 2 job ตั้งใจ: `verify` (typecheck/test/wf:test — เขียวสะอาดอยู่แล้ว
# ตอนเขียน) ตั้งเป็น required status check ได้ทันที ส่วน `lint` แยกออกมาเป็น
# job ของตัวเอง **ไม่ผูกกับ required check** เพราะตอนนี้มี 17 errors ของเดิมใน
# โค้ดที่ยังไม่ได้ไล่แก้ — ถ้ารวมไว้ใน job เดียวกับ verify จะบล็อก merge ทุก PR
# ทันทีจนกว่าจะแก้ 17 จุดนั้นก่อน ทั้งที่ไม่เกี่ยวกับ tenant-isolation test (ข้อ 1)
# ที่ต้องได้ประตูกั้นเร็วกว่านั้น — ไล่แก้ lint แล้วค่อยย้าย `lint` เข้า required
# check เป็นงานแยกทีหลัง
on:
  pull_request:
  push:
    branches: [main]

env:
  # ค่าหลอกสำหรับ CI เท่านั้น — typecheck/test ไม่ต้องต่อ DB จริง (prisma
  # generate อ่านแค่ schema, wf:test ใช้ PGlite ในตัวเอง — ดูคอมเมนต์ใน
  # vitest.workforce.config.ts) แต่บาง build step ต้องมีตัวแปรพวกนี้ตั้งไว้
  # ถึงจะไม่ throw ตอน validate env — **ห้ามใช้ค่าพวกนี้จริงที่ไหนทั้งสิ้น**
  #
  # TENANT_GUARD=strict — throw ทันทีถ้า query ไหนแตะโมเดลที่มี orgId โดยไม่
  # กรอง orgId (packages/database/tenant-guard.ts) ตอนนี้ยังไม่มี test ไหนใน
  # `pnpm test`/`wf:test` เรียก Prisma client จริงเลย (wf:test ใช้ Drizzle
  # คนละตัว ไม่ผ่านการ์ดนี้) เลยยังไม่ทำให้ CI แดงจากที่มีอยู่ — เตรียมไว้ให้
  # test ตัวใหม่ (fix-list ข้อ 1 track B) ได้ค่านี้ทันทีที่เพิ่มเข้ามา
  TENANT_GUARD: strict
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/ci
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: ci-only-placeholder-not-a-real-secret-32ch
  ACCESS_TOKEN_TTL: 15m
  REFRESH_TOKEN_TTL: 7d
  COOKIE_SECURE: "false"
  CRON_SECRET: ci-only-placeholder
  SEED_ADMIN_PASSWORD: ci-only-placeholder-12345
  SEED_STAFF_PASSWORD: ci-only-placeholder-12345

jobs:
  # ตั้งเป็น required status check ได้เลย — ผ่านสะอาดอยู่แล้ว ณ วันที่เขียน
  # (typecheck: 14 packages, test: 25+18, wf:test: 386 — เช็คจริงก่อนเขียนไฟล์นี้)
  verify:
    runs-on: ubuntu-latest
    # Postgres จริง (เวอร์ชันเดียวกับ docker-compose.yml ของ dev — prod เป็น
    # PG18, มี gap dev/CI 16 vs prod 18 อยู่ จดไว้ ยังไม่กระทบชุดเทสต์นี้เพราะ
    # ไม่ได้พึ่งพฤติกรรมเฉพาะเวอร์ชัน) ใช้เฉพาะ step tenant-isolation ด้านล่าง
    # — สร้างใหม่ทุกรัน ไม่มีอะไรค้างข้ามรันให้ต้อง cleanup เอง
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: smartboss_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: ติดตั้ง dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (apps/web, @smartboss/auth)
        run: pnpm test

      - name: Test (workforce — PGlite ในตัวเอง ไม่ต้องมี Postgres จริง)
        run: pnpm wf:test

      # ── Tenant isolation integration tests — ต่อ Postgres จริงข้างบน ──
      # แยกออกจาก `pnpm test` ข้างบนตั้งใจ (ดู apps/web/modules/__tests__/
      # tenant-isolation/README.md) ไม่งั้นทุก local `pnpm test` จะบังคับต้อง
      # มี Postgres รันอยู่ ทั้งที่ปกติเป็น pure unit test ล้วน
      - name: Migrate ฐานทดสอบ
        run: pnpm --filter @smartboss/database db:deploy
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/smartboss_test
          DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/smartboss_test

      - name: Test (tenant isolation — Postgres จริง)
        run: pnpm --filter web test:tenant-isolation
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/smartboss_test
          DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/smartboss_test

  # ยังไม่ผูกเป็น required check — มี 17 errors ของเดิมในโค้ดที่ยังไม่ได้แก้
  # (ดูหัวคอมเมนต์ของไฟล์) job นี้แยกอิสระจาก verify เพื่อไม่ให้บล็อก merge
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: ติดตั้ง dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
