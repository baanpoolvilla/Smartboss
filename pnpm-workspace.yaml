packages:
  - "apps/*"
  - "packages/*"
  # โมดูล workforce (HR / ลงเวลา / เงินเดือน) ย้ายเข้ามาเป็นกลุ่มย่อยของ packages
  - "packages/workforce/*"

# เครื่อง dev รัน pnpm install จากฝั่ง Windows แต่รัน Next dev จากในบ WSL
# ถ้าไม่บอกไว้ pnpm จะดึง native binary เฉพาะของ Windows แล้ว WSL จะพังตอน runtime
# (Tailwind v4 พา lightningcss ซึ่งเป็น native binary เข้ามา — ขาดแล้วทุกหน้าขึ้น error)
supportedArchitectures:
  os:
    - win32
    - linux
  cpu:
    - x64
  libc:
    - glibc

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "@swc/core"
  - argon2
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
